name: Retium Pay CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, chore/network-registry-foundation]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      RETIUM_RPC_URL: https://rpc.retium.org
      NEXT_PUBLIC_RETIUM_CHAIN_ID: "3"
      RETIUM_CHAIN_ID: "3"
      RETIUM_PROTOCOL_VERSION: "6"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
