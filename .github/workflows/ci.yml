name: RetiumP4y CI

on:
  push:
    branches:
      - rebuild/retium-pay-v2
  pull_request:
    branches:
      - rebuild/retium-pay-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --project tsconfig.json --noEmit --incremental false
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
